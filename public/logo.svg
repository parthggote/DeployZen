<svg width="256" height="256" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes blip {
      0%   { fill: #065f46; } /* Dark green */
      50%  { fill: #34D399; } /* Light green */
      100% { fill: #065f46; } /* Back to dark green */
    }
    .blip-circle {
      animation: blip 2s infinite alternate; /* 2s duration, infinite, alternates direction */
    }
  </style>

  <g>
    <rect x="6" y="6" width="88" height="88" rx="24" ry="24" fill="#282828"/>
    <rect x="9" y="9" width="82" height="82" rx="21" ry="21" fill="#FFFFFF"/>
  </g>

  <g transform="translate(0, -2)">
    <g fill="none" stroke="#34D399" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="32" y="45" width="36" height="20" rx="5" ry="5"/>
      <path d="M 50 45 V 38 H 44"/>
      <path d="M 32 55 H 24 M 24 52 v 6"/>
      <path d="M 68 55 H 76 M 76 52 v 6"/>
    </g>
    
    <g fill="#34D399">
      <circle cx="42" cy="55" r="3"/>
      <circle cx="58" cy="55" r="3"/>
    </g>
  </g>

  <circle cx="85" cy="15" r="5" class="blip-circle"/> 

</svg>
